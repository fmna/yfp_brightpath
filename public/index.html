<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YFP Onboarding Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Theme: light only, matching the reference screenshots. */
/* Layout: sticky top bar (brand · demo date · role switcher) over one centered work area, max 1200px.
   Employee = progress summary + 3-bucket board. Manager = attention callout + hires table. */
:root{
  --bg:#F4F6F3; --surface:#FFFFFF; --surface-2:#EEF2ED; --ink:#17211B; --ink-2:#4B574F; --ink-3:#5F6B63; --line:#DFE5DE;
  --brand:#2E7A48; --brand-strong:#215C35; --brand-soft:#E5F2E8; --on-brand:#FFFFFF;
  --mango:#E07A16; --mango-soft:#FDEFE0; --mango-ink:#8F4A07;
  --review:#5E4AA8; --review-soft:#EEEAF9;
  --post:#36608F; --post-soft:#E6EEF8;
  --danger:#B42318; --danger-soft:#FCEBE9;
  --shadow:0 1px 2px rgba(23,33,27,.05),0 4px 14px rgba(23,33,27,.06);
  --scrim:rgba(18,26,21,.38);
  --font-display:"Lexend",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.65rem;font-weight:600;line-height:1.2}
h2{font-size:1.1rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:1.05rem;line-height:1.1}
.brand-sub{font-size:.75rem;color:var(--ink-3);display:block;font-weight:500}
.demo-date{font-size:.78rem;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:4px 10px;white-space:nowrap}
.switcher{display:flex;align-items:center;gap:8px}
.switcher-label{font-size:.75rem;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 12px 5px 5px;display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg small{font-weight:500;color:var(--ink-3);font-size:.75rem}
.link-btn{border:0;background:none;color:var(--ink-3);font-size:.8rem;text-decoration:underline;text-underline-offset:3px;padding:4px}
.link-btn:hover{color:var(--ink)}

/* Avatars */
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;flex:none;font-family:var(--font-display)}
.av.lg{width:52px;height:52px;font-size:1rem}
.av.md{width:36px;height:36px;font-size:.8rem}
.av-alex{background:var(--mango-soft);color:var(--mango-ink)}
.av-morgan{background:var(--brand-soft);color:var(--brand-strong)}
.av-brooke{background:var(--review-soft);color:var(--review)}
.av-chris{background:var(--post-soft);color:var(--post)}

main{padding-block:28px 64px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head p{margin-top:4px}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 16px;font-weight:600;font-size:.9rem;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{background:var(--brand-strong)}
.btn-secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-danger{background:var(--danger);color:#fff}
.btn[disabled]{background:var(--surface-2);color:var(--ink-2);border-color:var(--line);cursor:not-allowed}
.btn-sm{padding:6px 12px;font-size:.82rem;border-radius:8px}
.icon-btn{border:1px solid transparent;background:transparent;border-radius:8px;width:34px;height:34px;display:inline-grid;vertical-align:middle;place-items:center;color:var(--ink-3)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}

/* Chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:6px;line-height:1.3;white-space:nowrap}
.chip-pre{background:var(--mango-soft);color:var(--mango-ink)}
.chip-post{background:var(--post-soft);color:var(--post)}
.chip-ar{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.chip-review{background:var(--review-soft);color:var(--review)}
.chip-new{background:var(--brand-soft);color:var(--brand-strong)}

/* Status pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill-ok{background:var(--brand-soft);color:var(--brand-strong)}
.pill-risk{background:var(--danger-soft);color:var(--danger)}

/* Progress */
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar>span{display:block;height:100%;background:var(--brand);border-radius:inherit;transition:width .3s ease}
.bar.risk>span{background:var(--danger)}

/* Summary panel (employee) */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.2fr);margin-bottom:28px}
.summary>section{padding:20px 22px;min-width:0}
.summary>section+section{border-left:1px solid var(--line)}
.ring-row{display:flex;align-items:center;gap:18px}
.ring{width:84px;height:84px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .ring-track{stroke:var(--surface-2)}
.ring .ring-val{stroke:var(--brand);transition:stroke-dashoffset .4s ease}
.ring-num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:1.2rem}
.stat-label{font-size:.78rem;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.big{font-family:var(--font-display);font-size:1.15rem;font-weight:600}
.next-card{display:flex;flex-direction:column;gap:10px;height:100%}
.next-card .btn{align-self:flex-start}
.split-meter{display:flex;flex-direction:column;gap:12px}
.meter-row{display:flex;flex-direction:column;gap:6px}
.meter-top{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}

/* Board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start}
.col-head{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.count{font-size:.78rem;font-weight:700;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:1px 8px}
.col-help{font-size:.82rem;color:var(--ink-3);margin-bottom:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{--tint:var(--line);text-align:left;width:100%;background:var(--surface);border:1.5px solid color-mix(in srgb,var(--tint) 45%,var(--line));border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 16px -10px color-mix(in srgb,var(--tint) 55%,transparent)}
.card:hover{border-color:color-mix(in srgb,var(--tint) 80%,var(--line))}
.col-today .card{--tint:var(--mango)}
.col-later .card{--tint:var(--review)}
.col-done .card{--tint:var(--brand)}
.card-title{font-family:var(--font-display);font-weight:600;font-size:1rem;line-height:1.3}
.col-done .card-title{color:var(--ink-2)}
.card-desc{font-size:.86rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;color:var(--ink-2)}
.card-foot.overdue{color:var(--danger)}
.card-foot.soon{color:var(--mango-ink)}
.just{margin-left:auto;font-size:.72rem;font-weight:700;color:var(--brand-strong);background:var(--brand-soft);padding:2px 8px;border-radius:6px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r-md);padding:22px 16px;text-align:center;color:var(--ink-3);font-size:.88rem;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty strong{color:var(--ink-2);font-weight:600}
.locked-group{margin-top:6px;border-top:1px solid var(--line);padding-top:14px}
.locked-head{display:flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.locked-row{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:transparent;border-radius:8px;text-align:left;color:var(--ink-3);font-size:.86rem}
.locked-row:hover{background:var(--surface-2);color:var(--ink-2)}
.locked-row span:first-of-type{flex:1;min-width:0}

/* Drawer & modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 14px 24px;border-bottom:1px solid var(--line)}
.drawer-body{padding:24px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:20px}
.drawer-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.drawer-foot .btn{width:100%}
.meta{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.88rem;margin:0}
.meta dt{color:var(--ink-3)} .meta dd{margin:0;font-weight:600}
.res-link{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid color-mix(in srgb,var(--brand) 40%,var(--line));border-radius:10px;background:var(--brand-soft);color:var(--brand-strong);text-decoration:none}
.res-locked{background:var(--surface-2);border-color:var(--line);color:var(--ink-2);cursor:not-allowed}
.res-locked .res-icon{color:var(--ink-3)}
.res-link:not(.res-locked):hover{border-color:var(--brand)}
.res-link:not(.res-locked):hover .res-label{text-decoration:underline;text-underline-offset:3px}
.res-icon{width:34px;height:34px;border-radius:8px;background:var(--surface);display:grid;place-items:center;flex:none}
.res-text{flex:1;min-width:0;display:flex;flex-direction:column}
.res-label{font-weight:700}
.res-url{font-size:.78rem;color:var(--ink-2);overflow-wrap:anywhere}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;font-size:.88rem}
.notice-lock{background:var(--post-soft);color:var(--post)}
.notice-done{background:var(--brand-soft);color:var(--brand-strong)}
.notice-warn{background:var(--danger-soft);color:var(--danger)}
.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 32px));max-height:calc(100% - 48px);background:var(--surface);border-radius:var(--r-lg);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.catalog{display:flex;flex-direction:column;gap:8px}
.cat-item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.cat-item:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.cat-item.disabled{cursor:not-allowed;opacity:.55}
.cat-item input{margin-top:4px;accent-color:var(--brand)}
.cat-item .cat-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cat-note{font-size:.78rem;color:var(--ink-3);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:600}
.modal-foot{flex-direction:row!important;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.field-inline{flex-direction:row;align-items:center;gap:10px;margin-right:auto}
.field input{font:inherit;font-weight:500;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:220px}

/* Manager */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .val{font-family:var(--font-display);font-size:1.7rem;font-weight:600;line-height:1.1}
.tile .val.risk{color:var(--danger)}
.tile .sub{font-size:.84rem;color:var(--ink-2)}
.callout{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--danger-soft);color:var(--ink);border-radius:var(--r-md);padding:14px 18px;margin-bottom:20px}
.callout p{display:flex;gap:10px;align-items:flex-start}
.callout svg{color:var(--danger);flex:none;margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:860px}
th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:10px 20px;background:var(--surface-2)}
td{padding:14px 20px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.who{display:flex;align-items:center;gap:12px}
.who-btn{border:0;background:none;padding:0;font-weight:700;font-size:.95rem;text-align:left}
.who-btn:hover{text-decoration:underline;text-underline-offset:3px}
.prog-cell{display:flex;flex-direction:column;gap:6px;min-width:150px}
.prog-cell .meter-top{font-size:.82rem}
.overdue-txt{color:var(--danger);font-weight:600}
.fresh{color:var(--brand-strong);font-weight:700}
.group-row td{background:var(--surface-2);font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);padding:8px 20px}
.task-cell{display:flex;flex-direction:column;gap:6px}
.task-cell strong{font-weight:600}
.st{font-weight:600;font-size:.84rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.st-done{color:var(--brand-strong)} .st-overdue{color:var(--danger)} .st-today{color:var(--mango-ink)} .st-later{color:var(--ink-2)} .st-locked{color:var(--ink-3)}
.confirm-row td{background:var(--danger-soft)}
.confirm-inner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.breadcrumb{display:flex;gap:6px;align-items:center;font-size:.86rem;margin-bottom:14px}
.breadcrumb button{border:0;background:none;padding:0;color:var(--brand-strong);font-weight:600}
.breadcrumb button:hover{text-decoration:underline}
.hire-head{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:20px;box-shadow:var(--shadow)}
.hire-id{display:flex;gap:14px;align-items:center;min-width:0}
.hire-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:.85rem;color:var(--ink-2)}
.required{font-size:.78rem;color:var(--ink-3);font-weight:600;white-space:nowrap}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px 12px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);font-size:.9rem}
.toast button{border:0;background:transparent;color:inherit;font-weight:700;padding:4px 8px;border-radius:6px;text-decoration:underline;text-underline-offset:3px}

.notfound{max-width:460px;margin:60px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}

@media (max-width:980px){
  .summary{grid-template-columns:1fr}
  .summary>section+section{border-left:0;border-top:1px solid var(--line)}
  .board{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr}
  .hire-head{grid-template-columns:1fr}
}
@media (max-width:640px){
  .switcher-label,.demo-date,.seg small{display:none}
  h1{font-size:1.4rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div id="app"></div>

<script src="04-mock-data.js"></script>
<script>
(function(){
"use strict";
/* ---------- Mock data: loaded from 04-mock-data.js ---------- */
var MOCK = window.YFP_MOCK_DATA;
if(!MOCK){
  document.getElementById("app").innerHTML='<main><div class="wrap"><div class="notfound"><h1>Demo data didn\u2019t load</h1><p class="muted">04-mock-data.js is missing or failed to load. Keep it in the same folder as index.html and reload the page.</p></div></div></main>';
  return;
}
var TODAY = MOCK.demo.today;
var STORE_KEY = MOCK.demo.storageKey;
var DEFS = MOCK.taskDefs;
var CATALOG = MOCK.catalog;
function t(def,due,doneOn,addedBy){return {def:def,due:due,done:!!doneOn,doneOn:doneOn||null,addedBy:addedBy||(DEFS[def].source==="hr"?"hr":"morgan"),justNow:false,isNew:false};}
function seed(){return MOCK.seed();}
var ORDER = MOCK.employeeOrder;

var data = load();
function load(){
  try{var raw=localStorage.getItem(STORE_KEY);if(raw){var p=JSON.parse(raw);if(p&&p.alex&&p.brooke&&p.chris)return p;}}catch(e){}
  return seed();
}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(data));}catch(e){}}

/* ---------- Dates ---------- */
function D(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2]);}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(s,n){var d=D(s);d.setDate(d.getDate()+n);return iso(d);}
function diff(a,b){return Math.round((D(b)-D(a))/86400000);}
function fmt(s){return D(s).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});}
function fmtLong(s){return D(s).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});}
function workday(start){var n=0,d=D(start),end=D(TODAY);while(d<=end){var w=d.getDay();if(w!==0&&w!==6)n++;d.setDate(d.getDate()+1);}return n;}

/* ---------- Domain rules ---------- */
function id(emp,task){return emp.id+"-"+task.def;}
function started(emp){return TODAY>=emp.start;}
function status(emp,task){
  if(task.done)return "done";
  if(DEFS[task.def].timing==="post"&&!started(emp))return "locked";
  if(task.due<TODAY)return "overdue";
  if(task.due<=addDays(TODAY,1))return "today";
  return "later";
}
function byDue(a,b){return a.due<b.due?-1:a.due>b.due?1:0;}
function buckets(emp){
  var b={today:[],later:[],locked:[],done:[]};
  emp.tasks.slice().sort(byDue).forEach(function(tk){
    var s=status(emp,tk);
    if(s==="overdue"||s==="today")b.today.push(tk);
    else if(s==="later")b.later.push(tk);
    else if(s==="locked")b.locked.push(tk);
    else b.done.push(tk);
  });
  return b;
}
function stats(emp){
  var total=emp.tasks.length,done=emp.tasks.filter(function(x){return x.done;}).length;
  var overdue=emp.tasks.filter(function(x){return status(emp,x)==="overdue";}).sort(byDue);
  var pre=emp.tasks.filter(function(x){return DEFS[x.def].timing==="pre";});
  var preDone=pre.filter(function(x){return x.done;}).length;
  var open=emp.tasks.filter(function(x){var s=status(emp,x);return s!=="done"&&s!=="locked";}).sort(byDue);
  return {total:total,done:done,pct:total?Math.round(done/total*100):0,overdue:overdue,pre:pre.length,preDone:preDone,
    post:total-pre.length,next:open[0]||null,risk:overdue.length>0};
}
function stage(emp){
  if(!started(emp)){var n=diff(TODAY,emp.start);return {label:"Starts "+fmt(emp.start),sub:n+" day"+(n===1?"":"s")+" until Day 1"};}
  return {label:"Day "+workday(emp.start),sub:"Started "+fmt(emp.start)};
}
function lastActivity(emp){
  var fresh=emp.tasks.filter(function(x){return x.justNow;});
  if(fresh.length)return {text:"Completed “"+DEFS[fresh[fresh.length-1].def].title+"”",when:"Just now",fresh:true};
  var d=emp.tasks.filter(function(x){return x.done;}).sort(function(a,b){return a.doneOn<b.doneOn?1:-1;})[0];
  if(!d)return {text:"No tasks completed yet",when:"",fresh:false};
  var ago=diff(d.doneOn,TODAY);
  return {text:"Completed “"+DEFS[d.def].title+"”",when:ago===0?"Today":ago===1?"Yesterday":ago+" days ago",fresh:false};
}
function dueText(emp,tk){
  var s=status(emp,tk);
  if(s==="done")return {cls:"",icon:"check",text:"Completed "+(tk.doneOn===TODAY?"today":fmt(tk.doneOn))};
  if(s==="locked")return {cls:"",icon:"lock",text:"Unlocks "+fmt(emp.start)};
  if(s==="overdue"){var n=diff(tk.due,TODAY);return {cls:"overdue",icon:"alert",text:"Overdue by "+n+" day"+(n===1?"":"s")};}
  var dd=diff(TODAY,tk.due);
  if(dd===0)return {cls:"soon",icon:"cal",text:"Due today"};
  if(dd===1)return {cls:"soon",icon:"cal",text:"Due tomorrow"};
  return {cls:"",icon:"cal",text:"Due "+fmt(tk.due)};
}
function findTask(tid){
  for(var i=0;i<ORDER.length;i++){var e=data[ORDER[i]];for(var j=0;j<e.tasks.length;j++){if(id(e,e.tasks[j])===tid)return {emp:e,task:e.tasks[j]};}}
  return null;
}
function clearFlags(){ORDER.forEach(function(k){data[k].tasks.forEach(function(x){x.isNew=false;});});}

/* ---------- Routing (plain #name hashes) ---------- */
function route(){
  var h=(location.hash||"").replace(/^#/,"");
  if(h===""||h==="home")return {view:"home",role:"alex"};
  if(h.indexOf("task-")===0)return {view:"home",role:"alex",task:h.slice(5)};
  if(h==="team")return {view:"team",role:"morgan"};
  if(h.indexOf("team-")===0)return {view:"hire",role:"morgan",emp:h.slice(5)};
  return {view:"404",role:null};
}
function go(h){if(location.hash==="#"+h)render();else location.hash=h;}

function ring(pct){
  var r=36,c=2*Math.PI*r,off=c*(1-pct/100);
  return '<div class="ring" role="img" aria-label="'+pct+' percent complete"><svg width="84" height="84" viewBox="0 0 84 84"><circle class="ring-track" cx="42" cy="42" r="'+r+'" fill="none" stroke-width="9"/>'+
    '<circle class="ring-val" cx="42" cy="42" r="'+r+'" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'"/></svg><span class="ring-num num">'+pct+'%</span></div>';
}

function taskCard(emp,tk){
  var d=DEFS[tk.def],due=dueText(emp,tk),tid=id(emp,tk);
  return '<button type="button" class="card" data-action="open-task" data-id="'+tid+'" data-fkey="card-'+tid+'">'+
    chips(tk.def)+'<span class="card-title">'+esc(d.title)+'</span><span class="card-desc">'+esc(d.desc)+'</span>'+
    '<span class="card-foot '+due.cls+'">'+icon(due.icon,15)+'<span>'+due.text+'</span>'+(tk.justNow?'<span class="just">Just completed</span>':'')+'</span></button>';
}

  var next=s.next;
  var nextHtml;

    nextHtml='<div class="next-card"><p class="stat-label">Next up</p><p class="big">'+esc(DEFS[next.def].title)+'</p>'+

  }

    '</div></section>'+

    return '<section class="col col-'+key+'" aria-labelledby="h-'+key+'"><div class="col-head"><h2 id="h-'+key+'">'+title+'</h2><span class="count num">'+list.length+'</span></div>'+

  var emp=f.emp,tk=f.task,d=DEFS[tk.def],s=status(emp,tk),due=dueText(emp,tk);
  var by=tk.addedBy==="hr"?"BrightPath HR (required)":"Morgan Miller, your manager";

  if(s==="done")notice='<div class="notice notice-done">'+icon("check",18)+'<span>Completed '+(tk.doneOn===TODAY?"today":"on "+fmtLong(tk.doneOn))+'. Your manager can see this.</span></div>';
  var foot;

  else if(s==="locked")foot='<button class="btn btn-primary" disabled>Available on '+fmt(emp.start)+'</button>';
  else foot='<button class="btn btn-primary" data-action="complete" data-id="'+tid+'" data-fkey="complete">'+icon("check",18)+(d.type==="review"?'Mark as reviewed':'Mark as complete')+'</button><p class="faint" style="font-size:.8rem;text-align:center">Your progress and your manager’s dashboard update right away.</p>';

    '<div class="drawer-head"><span class="faint" style="font-size:.85rem;font-weight:600">Task details</span><button class="icon-btn" data-action="close-drawer" aria-label="Close task details" data-fkey="dclose">'+icon("x",18)+'</button></div>'+
    '<div class="drawer-body">'+chips(tk.def)+'<h2 id="dr-title" tabindex="-1" style="font-size:1.4rem">'+esc(d.title)+'</h2>'+notice+
      '<dl class="meta"><dt>Due</dt><dd class="num">'+fmtLong(tk.due)+(s==="overdue"||s==="today"?' <span class="'+(s==="overdue"?"overdue-txt":"")+'" style="font-weight:500">('+due.text.toLowerCase()+')</span>':'')+'</dd>'+
      '<dt>Assigned by</dt><dd>'+by+'</dd><dt>Type</dt><dd>'+(d.type==="ar"?"Action required":"Review")+' · '+(d.timing==="pre"?"Before Day 1":"From Day 1")+'</dd></dl>'+
      '<div><h3 style="margin-bottom:6px">About this task</h3><p class="muted">'+esc(d.desc)+'</p></div>'+

function viewTeam(){
  var emps=ORDER.map(function(k){return data[k];});
  var rows=emps.map(function(e){return {e:e,s:stats(e),st:stage(e),a:lastActivity(e)};})
    .sort(function(x,y){if(x.s.risk!==y.s.risk)return x.s.risk?-1:1;return x.e.start<y.e.start?-1:1;});
  var risk=rows.filter(function(x){return x.s.risk;});
  var avg=Math.round(rows.reduce(function(a,x){return a+x.s.pct;},0)/rows.length);
  var upcoming=rows.filter(function(x){return !started(x.e);}).sort(function(a,b){return a.e.start<b.e.start?-1:1;})[0];

  var head='<div class="page-head"><div><p class="eyebrow">Manager view</p><h1>Your new hires</h1><p class="muted">'+rows.length+' people onboarding. Progress updates as soon as they complete a task.</p></div></div>';
  var tiles='<div class="tiles">'+
    '<div class="tile"><span class="stat-label">Need support</span><span class="val num '+(risk.length?"risk":"")+'">'+risk.length+'</span><span class="sub">'+(risk.length?risk.map(function(x){return x.e.first+' · '+x.s.overdue.length+' overdue';}).join(", "):'Everyone is on track')+'</span></div>'+
    '<div class="tile"><span class="stat-label">Average progress</span><span class="val num">'+avg+'%</span><span class="sub">Across all assigned tasks</span></div>'+
    '<div class="tile"><span class="stat-label">Starting next</span><span class="val" style="font-size:1.25rem;padding-block:4px">'+(upcoming?upcoming.e.name:"None")+'</span><span class="sub">'+(upcoming?fmt(upcoming.e.start)+' · '+(upcoming.s.pre-upcoming.s.preDone)+' Pre-D1 tasks left':'No upcoming start dates')+'</span></div>'+

  var callout=risk.map(function(x){var o=x.s.overdue[0];return '<div class="callout"><p>'+icon("alert",18)+'<span><strong>'+x.e.name+' may need support.</strong> '+x.s.overdue.length+' overdue task'+(x.s.overdue.length===1?'':'s')+', including “'+esc(DEFS[o.def].title)+'” (due '+fmt(o.due)+').</span></p><button class="btn btn-secondary btn-sm" data-action="open-hire" data-emp="'+x.e.id+'" data-fkey="callout-'+x.e.id+'">Review '+x.e.first+'’s plan</button></div>';}).join("");

  var table='<div class="panel"><div class="panel-head"><h2>Onboarding progress</h2><span class="faint" style="font-size:.84rem">Sorted by who needs attention first</span></div><div class="table-scroll"><table>'+
    '<thead><tr><th>New hire</th><th>Stage</th><th>Progress</th><th>Next due</th><th>Status</th><th>Latest activity</th></tr></thead><tbody>'+
    rows.map(function(x){
      var e=x.e,s=x.s,nx=s.next,nd=nx?dueText(e,nx):null;
      return '<tr class="clickable" data-action="open-hire" data-emp="'+e.id+'">'+
        '<td><div class="who">'+av(e.id,e.initials,"md")+'<div><button class="who-btn" data-action="open-hire" data-emp="'+e.id+'" data-fkey="hire-'+e.id+'">'+e.name+'</button><div class="faint" style="font-size:.8rem">'+e.role+' · '+e.dept+'</div></div></div></td>'+
        '<td><strong>'+x.st.label+'</strong><div class="faint" style="font-size:.8rem">'+x.st.sub+'</div></td>'+
        '<td><div class="prog-cell"><div class="meter-top"><strong class="num">'+s.pct+'%</strong><span class="faint num">'+s.done+'/'+s.total+' tasks</span></div><div class="bar'+(s.risk?" risk":"")+'"><span style="width:'+s.pct+'%"></span></div></div></td>'+
        '<td>'+(nx?esc(DEFS[nx.def].title)+'<div class="'+(nd.cls==="overdue"?"overdue-txt":"faint")+'" style="font-size:.8rem">'+nd.text+'</div>':'<span class="faint">Nothing open</span>')+'</td>'+

        '<td><span class="'+(x.a.fresh?"fresh":"")+'" style="font-size:.84rem">'+(x.a.when?x.a.when:'')+'</span><div class="faint" style="font-size:.8rem;max-width:220px">'+x.a.text+'</div></td>'+
      '</tr>';
    }).join("")+'</tbody></table></div></div>';
  return head+tiles+callout+table;

  var s=stats(emp),st=stage(emp);
  var head='<nav class="breadcrumb" aria-label="Breadcrumb"><button data-action="back-team" data-fkey="crumb">New hires</button><span class="faint">/</span><span>'+emp.name+'</span></nav>'+
    '<div class="hire-head"><div class="hire-id">'+av(emp.id,emp.initials,"lg")+'<div style="min-width:0"><h1 style="font-size:1.4rem">'+emp.name+'</h1>'+
      '<div class="hire-meta"><span>'+emp.role+' · '+emp.dept+'</span><span class="faint">•</span><span>'+st.label+' · '+st.sub+'</span>'+(s.risk?'<span class="pill pill-risk">Needs support</span>':'<span class="pill pill-ok">On track</span>')+'</div></div></div>'+
      '<div class="prog-cell"><div class="meter-top"><span><strong class="num">'+s.pct+'%</strong> complete</span><span class="faint num">'+s.done+' of '+s.total+' tasks</span></div><div class="bar'+(s.risk?" risk":"")+'"><span style="width:'+s.pct+'%"></span></div>'+
        (s.risk?'<span class="overdue-txt" style="font-size:.82rem">'+s.overdue.length+' overdue</span>':'<span class="faint" style="font-size:.82rem">No overdue tasks</span>')+'</div>'+
      '<button class="btn btn-primary" data-action="add-open" data-fkey="add-open">'+icon("plus",16)+'Add task</button></div>';

  var groups=[["pre","Before Day 1 (Pre-D1)"],["post","From Day 1 (Post-D1)"]];
  var body=groups.map(function(g){
    var list=emp.tasks.filter(function(x){return DEFS[x.def].timing===g[0];}).sort(byDue);
    var out='<tr class="group-row"><td colspan="5">'+g[1]+' · '+list.filter(function(x){return x.done;}).length+'/'+list.length+' done</td></tr>';
    if(!list.length)out+='<tr><td colspan="5" class="faint">No '+g[0]+'-D1 tasks in this plan.</td></tr>';
    list.forEach(function(tk){
      var tid=id(emp,tk),d=DEFS[tk.def];
      var removable=tk.addedBy!=="hr"&&!tk.done;
      var action=tk.addedBy==="hr"?'<span class="required" title="Required tasks are managed by HR">Required by HR</span>':
        tk.done?'<span class="required" title="Completed tasks stay in the plan as a record">Completed</span>':
        '<button class="icon-btn danger" data-action="remove-ask" data-id="'+tid+'" data-fkey="rm-'+tid+'" aria-label="Remove '+esc(d.title)+'">'+icon("trash",17)+'</button>';
      out+='<tr><td><div class="task-cell"><strong>'+esc(d.title)+'</strong>'+chips(tk.def,tk.isNew?'<span class="chip chip-new">Just added</span>':'')+'</div></td>'+
        '<td class="num">'+fmt(tk.due)+'</td><td>'+statusCell(emp,tk)+'</td><td class="muted">'+(tk.addedBy==="hr"?"HR":"Morgan Miller")+'</td><td style="text-align:right">'+action+'</td></tr>';
      if(ui.confirm===tid&&removable){
        out+='<tr class="confirm-row"><td colspan="5"><div class="confirm-inner"><span>Remove “'+esc(d.title)+'” from '+emp.first+'’s plan? '+emp.first+' will no longer see it.</span>'+
          '<span style="display:flex;gap:8px"><button class="btn btn-secondary btn-sm" data-action="remove-cancel" data-fkey="rm-cancel">Cancel</button><button class="btn btn-danger btn-sm" data-action="remove-confirm" data-id="'+tid+'" data-fkey="rm-confirm">Remove task</button></span></div></td></tr>';
      }
    });
    return out;
  }).join("");

  var table='<div class="panel"><div class="panel-head"><h2>Onboarding plan</h2><span class="faint" style="font-size:.84rem">Add tasks from the catalog. HR-required tasks can’t be removed.</span></div><div class="table-scroll"><table>'+
    '<thead><tr><th>Task</th><th>Due</th><th>Status</th><th>Added by</th><th><span class="sr">Actions</span></th></tr></thead><tbody>'+body+'</tbody></table></div></div>';
  return head+table+(ui.addOpen?addModal(emp):"");
}

function addModal(emp){
  var assigned={};emp.tasks.forEach(function(x){assigned[x.def]=true;});
  var avail=CATALOG.filter(function(c){return !assigned[c]&&!(DEFS[c].timing==="pre"&&started(emp));});
  var sorted=CATALOG.filter(function(c){return avail.indexOf(c)>-1;}).concat(CATALOG.filter(function(c){return avail.indexOf(c)<0;}));
  var items=sorted.map(function(c){
    var d=DEFS[c],dis=assigned[c]?"Already in "+emp.first+"’s plan":(d.timing==="pre"&&started(emp))?"Pre-D1 tasks can’t be added after the start date":"";
    return '<label class="cat-item'+(dis?" disabled":"")+'"><input type="radio" name="cat" id="cat-'+c+'" value="'+c+'" data-action="add-pick" data-fkey="cat-'+c+'" '+(dis?"disabled":"")+(ui.pick===c?" checked":"")+'>'+
      '<span class="cat-main"><strong>'+esc(d.title)+'</strong>'+chips(c)+'<span class="muted" style="font-size:.84rem">'+esc(d.desc)+'</span>'+(dis?'<span class="cat-note">'+dis+'</span>':'')+'</span></label>';
  }).join("");
  var body=avail.length?'<div class="catalog" role="radiogroup" aria-label="Task catalog">'+items+'</div>':
    '<div class="empty"><strong>Every catalog task is already in '+emp.first+'’s plan</strong>Remove a task first if you want to re-add it with a new due date.</div>';
  return '<div class="scrim" data-action="add-close"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="add-title">'+
    '<div class="drawer-head"><h2 id="add-title" tabindex="-1">Add a task for '+emp.first+'</h2><button class="icon-btn" data-action="add-close" aria-label="Close" data-fkey="add-x">'+icon("x",18)+'</button></div>'+
    '<div class="drawer-body" style="gap:16px"><p class="muted" style="font-size:.9rem">Choose from the BrightPath task catalog. '+emp.first+' sees new tasks right away.</p>'+body+
    '</div>'+
    '<div class="drawer-foot modal-foot">'+(ui.pick?'<label class="field field-inline" for="due-input">Due date<input type="date" id="due-input" value="'+ui.due+'" min="'+TODAY+'" data-fkey="due"></label>':'<span class="faint" style="font-size:.85rem;margin-right:auto">Select a task to set its due date</span>')+'<button class="btn btn-secondary" data-action="add-close" style="width:auto">Cancel</button>'+
    '<button class="btn btn-primary" data-action="add-submit" data-fkey="add-submit" style="width:auto" '+(ui.pick?"":"disabled")+'>Add to '+emp.first+'’s plan</button></div></div>';
}

function notFound(title,text,dest,cta){
  return '<div class="notfound"><span class="av lg av-morgan">?</span><h1>'+title+'</h1><p class="muted">'+text+'</p><button class="btn btn-primary" data-action="go" data-dest="'+dest+'">'+cta+'</button></div>';
}

/* ---------- Render ---------- */
var app=document.getElementById("app");
var lastView=null;
function render(){
  var r=route();
  var focusKey=document.activeElement&&document.activeElement.getAttribute&&document.activeElement.getAttribute("data-fkey");
  var viewKey=r.view+(r.emp||"");
  if(lastView!==viewKey){if(lastView!==null&&!keepToast)ui.toast=null;keepToast=false;ui.confirm=null;ui.addOpen=false;ui.pick=null;if(lastView!==null&&lastView.indexOf("home")!==0)clearFlags();}
  var html;
  if(r.view==="home")html=viewHome(r);
  else if(r.view==="team")html=viewTeam();
  else if(r.view==="hire")html=viewHire(r);
  else html=notFound("We couldn’t find that page","The link may be out of date. Pick where you want to go.","home","Go to Alex’s dashboard");
  app.innerHTML=topbar(r.view==="404"?{role:null}:r)+'<main><div class="wrap">'+html+'</div></main>'+
    (ui.toast?'<div class="toast" role="status"><span>'+ui.toast.msg+'</span>'+(ui.toast.undo?'<button data-action="toast-undo" data-fkey="undo">Undo</button>':'')+'<button data-action="toast-close" aria-label="Dismiss">'+icon("x",14)+'</button></div>':'<div class="sr" role="status"></div>');
  document.title=(r.view==="team"||r.view==="hire"?"Manager":"Alex")+" · YFP Onboarding Prototype";
  var opened=(r.task&&lastTask!==r.task)||(ui.addOpen&&!lastAdd);
  if(r.task&&lastTask!==r.task){var h=document.getElementById("dr-title");if(h)h.focus();}
  else if(ui.addOpen&&!lastAdd){var a=document.getElementById("add-title");if(a)a.focus();}
  else if(lastTask&&!r.task&&opener){var oe=app.querySelector('[data-fkey="'+opener+'"]')||app.querySelector('[data-fkey="next"]');if(oe)oe.focus();opener=null;}
  else if(focusKey){var el=app.querySelector('[data-fkey="'+focusKey+'"]');if(el)el.focus();}
  if(lastView!==viewKey&&!opened)window.scrollTo(0,0);
  lastTask=r.task||null;lastAdd=ui.addOpen;lastView=viewKey;
}
var lastTask=null,lastAdd=false,keepToast=false,opener=null;

/* ---------- Actions ---------- */
function complete(tid){
  var f=findTask(tid);if(!f)return;
  var before=stats(f.emp).pct;
  ORDER.forEach(function(k){data[k].tasks.forEach(function(x){x.justNow=false;});});
  f.task.done=true;f.task.doneOn=TODAY;f.task.justNow=true;save();
  var after=stats(f.emp).pct;
  toast("Task completed. Your progress went from "+before+"% to "+after+"%.",function(){f.task.done=false;f.task.doneOn=null;f.task.justNow=false;save();});
  go("home");
}
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-action]");if(!el)return;
  var a=el.getAttribute("data-action"),tid=el.getAttribute("data-id");
  if(a==="demo-link"){ev.preventDefault();toast("Prototype link. In the live product this opens "+esc(el.getAttribute("data-url").replace(/^https:\/\//,""))+".");render();return;}
  if(a==="add-pick")return; // handled by change
  if(el.tagName==="TR"&&ev.target.closest("button"))return;
  switch(a){
    case "role":go(el.getAttribute("data-role")==="morgan"?"team":"home");break;
    case "open-task":opener=el.getAttribute("data-fkey");go("task-"+tid);break;
    case "close-drawer":go("home");break;
    case "complete":complete(tid);break;
    case "reopen":var f=findTask(tid);if(f){f.task.done=false;f.task.doneOn=null;f.task.justNow=false;save();toast("Marked as not done.");render();}break;
    case "open-hire":go("team-"+el.getAttribute("data-emp"));break;
    case "back-team":go("team");break;
    case "go":go(el.getAttribute("data-dest"));break;
    case "remove-ask":ui.confirm=tid;render();var c=app.querySelector('[data-fkey="rm-confirm"]');if(c)c.focus();break;
    case "remove-cancel":var back=ui.confirm;ui.confirm=null;render();var b=app.querySelector('[data-fkey="rm-'+back+'"]');if(b)b.focus();break;
    case "remove-confirm":
      var g=findTask(tid);if(g){var idx=g.emp.tasks.indexOf(g.task),removed=g.task,emp=g.emp;emp.tasks.splice(idx,1);ui.confirm=null;save();
        toast("Removed “"+esc(DEFS[removed.def].title)+"” from "+emp.first+"’s plan.",function(){emp.tasks.splice(idx,0,removed);save();});}
      render();break;
    case "add-open":ui.addOpen=true;ui.toast=null;ui.pick=null;render();break;
    case "add-close":ui.addOpen=false;ui.pick=null;render();var ao=app.querySelector('[data-fkey="add-open"]');if(ao)ao.focus();break;
    case "add-submit":
      var r=route(),e=data[r.emp];if(!e||!ui.pick)break;
      var di=document.getElementById("due-input");var due=(di&&di.value)||ui.due;if(due<TODAY)due=TODAY;
      var nt=t(ui.pick,due,null,"morgan");nt.isNew=true;e.tasks.push(nt);save();
      toast("Added “"+esc(DEFS[ui.pick].title)+"” to "+e.first+"’s plan.");
      ui.addOpen=false;ui.pick=null;render();break;
    case "reset":keepToast=true;data=seed();save();ui={confirm:null,addOpen:false,pick:null,due:"",toast:null};toast("Demo data reset to the starting state.");render();break;
    case "toast-undo":var u=ui.toast&&ui.toast.undo;ui.toast=null;if(u)u();render();break;
    case "toast-close":ui.toast=null;render();break;
  }
});
document.addEventListener("change",function(ev){
  var el=ev.target;
  if(el.matches('input[name="cat"]')){
    ui.pick=el.value;var e=data[route().emp],d=DEFS[el.value];
    var sug=addDays(e.start,d.offset||0);ui.due=sug<TODAY?addDays(TODAY,2):sug;render();
  }
  if(el.id==="due-input")ui.due=el.value;
});
document.addEventListener("keydown",function(ev){
  if(ev.key!=="Escape")return;
  var r=route();
  if(ui.addOpen){ui.addOpen=false;ui.pick=null;render();}
  else if(r.task)go("home");
  else if(ui.confirm){ui.confirm=null;render();}
});
window.addEventListener("hashchange",render);
render();
})();
</script>

</body>
</html>
